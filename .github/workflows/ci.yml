name: Windows 质量检查
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install:electron
      - run: node scripts/windows-preflight.mjs
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check:boundaries
      - run: pnpm check:docs
      - run: pnpm check:release
      - run: pnpm pack:cli
      - run: pnpm test:g03
      - run: pnpm test:g02
      - run: pnpm test:stage2
      - run: pnpm test:stage3
      - run: pnpm test:stage4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-validation-${{ github.run_id }}
          path: |
            artifacts/g06/g02-regression/report.json
            artifacts/g06/g03-regression/report.json
            artifacts/g06/startup-*.json
            artifacts/g06/windows-preflight.json
            artifacts/stage2/**
            artifacts/stage3/**
            artifacts/stage4/**
          if-no-files-found: warn
          retention-days: 7
